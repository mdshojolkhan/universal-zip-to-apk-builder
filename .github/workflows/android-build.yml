name: Android APK Builder

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: "Android project directory inside the repository"
        required: true
        default: "."
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate project path
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail

          if [[ "$PROJECT_PATH" == /* ||
                "$PROJECT_PATH" == *".."* ]]; then
            echo "Invalid project path."
            exit 1
          fi

          if [[ ! -d "$PROJECT_PATH" ]]; then
            echo "Project directory not found."
            exit 1
          fi

          echo "Project path validated."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android APK
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail

          cd "$PROJECT_PATH"

          if [[ -f "./gradlew" ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          elif [[ -f "build.gradle" ||
                  -f "build.gradle.kts" ]]; then
            echo "Gradle wrapper is missing."
            echo "Add the project's Gradle wrapper first."
            exit 1
          else
            echo "No Gradle Android project found."
            exit 1
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            ${{ inputs.project_path }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
